name: Anno PR Summary

on:
  pull_request:
    types: ['opened']

jobs:
  anno:
    runs-on: ubuntu-latest
    steps:
      - uses: constantincerdan/anno@v7
        with:
          mode: pr-summary
          ai_provider: anthropic
          ai_model: claude-sonnet-4-5-20250929
          ai_api_key: ${{ secrets.CLAUDE_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
